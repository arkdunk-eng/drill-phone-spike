<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電話シミュレータ 検証3</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; max-width: 720px; background: #fff; color: #222; }
  h1 { font-size: 1.2rem; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  button { font-size: 1rem; padding: 10px 16px; border-radius: 8px; border: 1px solid #888; background: #f4f4f4; }
  #ptt { width: 100%; padding: 28px; font-size: 1.3rem; background: #e8f0ff; touch-action: none; user-select: none; -webkit-user-select: none; }
  #ptt.on { background: #ffd8d8; border-color: #c33; }
  #ptt:disabled { opacity: .4; }
  #status { font-weight: bold; }
  #log { border: 1px solid #ccc; border-radius: 8px; padding: 8px; min-height: 200px; white-space: pre-wrap; font-size: .95rem; }
  .u { color: #0a4; } .m { color: #04a; } .sys { color: #888; font-size: .85rem; }
  #auto { padding: 20px; border-radius: 8px; background: #e8ffe8; font-size: 1.1rem; }
  #usage { font-size: .85rem; color: #555; }
</style>
</head>
<body>
<h1>電話シミュレータ 検証3（使い捨て）— スズケン沼津支店／甚大な場面</h1>
<div class="row">
  声: <select id="voice">
    <option>Orus</option><option>Iapetus</option><option>Charon</option><option>Rasalgethi</option>
  </select>
  方式: <select id="mode"><option value="tap">タップして話す（黙ると自動で送る）</option><option value="hold">押している間だけ話す</option><option value="low">常時通話（感度 低）</option><option value="high">常時通話（感度 高）</option></select>
  声の大きさのしきい値: <input id="th" type="number" value="0.02" step="0.005" style="width:5em">
</div>
<div class="row">
  <button id="call">発信</button>
  <button id="hang" disabled>切る</button>
  <span id="status">待機中</span>
</div>
<button id="ptt" disabled>押している間だけ話す（パソコンはスペースキーでも可）</button>
<div id="auto" hidden>常時通話: 話しかければ相手が答えます。マイクの音の大きさ <span id="level">-</span></div>
<p id="usage"></p>
<div id="log"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyjYMTPqWhVYFWQFzH5IKo_TgIPiOE8N1d7bNDfqQjUPTxHktbzA9LJ8wfuvou3DEyc/exec';
const WS_BASE ='wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained';
const $ = id => document.getElementById(id);
let ws, micStream, ctxIn, ctxOut, workletNode, talking = false, nextPlay = 0, sources = [];
let curU = null, curM = null, callStart = 0, releasedAt = 0, waitingFirstAudio = false, ringTimer = null;

function log(cls, text) {
  const div = document.createElement('div'); div.className = cls; div.textContent = text;
  $('log').appendChild(div); return div;
}
function status(t) { $('status').textContent = t; }

function ring() {
  const c = new AudioContext();
  let n = 0;
  const once = () => {
    if (n++ >= 2) return;
    for (const [f, t] of [[400, 0], [450, 0]]) {
      const o = c.createOscillator(), g = c.createGain();
      o.frequency.value = f; g.gain.value = 0.05;
      o.connect(g).connect(c.destination); o.start(c.currentTime + t); o.stop(c.currentTime + 1.0);
    }
    ringTimer = setTimeout(once, 2500);
  };
  once();
  return () => { clearTimeout(ringTimer); setTimeout(() => c.close(), 1200); };
}

function b64FromInt16(int16) {
  const bytes = new Uint8Array(int16.buffer);
  let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

function playPcm24k(b64) {
  const bin = atob(b64), len = bin.length / 2;
  const buf = ctxOut.createBuffer(1, len, 24000), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    let v = bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8);
    if (v >= 0x8000) v -= 0x10000;
    ch[i] = v / 0x8000;
  }
  const src = ctxOut.createBufferSource(); src.buffer = buf; src.connect(ctxOut.destination);
  nextPlay = Math.max(nextPlay, ctxOut.currentTime + 0.05);
  src.start(nextPlay); nextPlay += buf.duration;
  sources.push(src); src.onended = () => { sources = sources.filter(s => s !== src); };
}
function stopPlayback() { sources.forEach(s => { try { s.stop(); } catch {} }); sources = []; nextPlay = 0; }

// iPadのSafariは録音の標本化周波数を指定できないことがあるため、端末の周波数で録って16kHzに直す
function to16k(src, rate) {
  if (rate === 16000) return src;
  const n = Math.floor(src.length * 16000 / rate), out = new Float32Array(n), r = rate / 16000;
  for (let i = 0; i < n; i++) {
    const x = i * r, j = Math.floor(x), t = x - j;
    out[i] = src[j] * (1 - t) + (src[j + 1] ?? src[j]) * t;
  }
  return out;
}

async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
  await ctxIn.resume();
  const chunk = Math.round(ctxIn.sampleRate / 10);
  const code = `class P extends AudioWorkletProcessor {
    constructor(){ super(); this.buf = []; }
    process(inputs){ const ch = inputs[0][0]; if (ch) { this.buf.push(...ch); if (this.buf.length >= ${chunk}) { this.port.postMessage(new Float32Array(this.buf)); this.buf = []; } } return true; }
  } registerProcessor('p', P);`;
  await ctxIn.audioWorklet.addModule(URL.createObjectURL(new Blob([code], { type: 'application/javascript' })));
  workletNode = new AudioWorkletNode(ctxIn, 'p');
  log('sys', `録音の標本化周波数: ${ctxIn.sampleRate} Hz`);
  workletNode.port.onmessage = e => {
    if (!ws || ws.readyState !== 1) return;
    if (!isAuto() && !talking) return;
    if (isAuto() && !ready) return;
    const f = to16k(e.data, ctxIn.sampleRate), i16 = new Int16Array(f.length);
    let sum = 0;
    for (let i = 0; i < f.length; i++) { i16[i] = Math.max(-1, Math.min(1, f[i])) * 0x7fff; sum += f[i] * f[i]; }
    const rms = Math.sqrt(sum / f.length);
    peakRms = Math.max(peakRms, rms);
    const msg = JSON.stringify({ realtimeInput: { audio: { data: b64FromInt16(i16), mimeType: 'audio/pcm;rate=16000' } } });
    if (isAuto()) { $('level').textContent = rms.toFixed(3); ws.send(msg); return; }
    talkMs += 100;
    if (isTap() && talkMs >= TAP_MAX_MS) { pressEnd(); return; }
    if (!activitySent) {
      if (isTap() && talkMs >= TAP_WAIT_MS) { pressEnd(); return; }
      // 声が出るまでは送らずに直近の数個だけ溜める（言葉の頭が切れないように）
      pending.push(msg); if (pending.length > 5) pending.shift();
      if (rms < Number($('th').value)) return;
      ws.send(JSON.stringify({ realtimeInput: { activityStart: {} } }));
      activitySent = true;
      pending.forEach(m => ws.send(m)); pending = [];
      return;
    }
    ws.send(msg);
    if (isTap() && !ending) {
      silentMs = rms < Number($('th').value) ? silentMs + 100 : 0;
      if (silentMs >= TAP_SILENCE_MS) pressEnd();
    }
  };
  ctxIn.createMediaStreamSource(micStream).connect(workletNode);
}

let activitySent = false, pending = [], peakRms = 0, ready = false, talkMs = 0, silentMs = 0, noReplyTimer = null;
// タップ方式: 1.2秒黙ったら送る。声が出ないまま8秒、または話し始めから15秒で打ち切る
const TAP_SILENCE_MS = 1200, TAP_WAIT_MS = 8000, TAP_MAX_MS = 15000;
function pressStart() {
  if (talking || ending || !ws || ws.readyState !== 1) return;
  stopPlayback();
  talking = true; activitySent = false; pending = []; peakRms = 0; talkMs = 0; silentMs = 0;
  $('ptt').classList.add('on');
  if (isTap()) ptt.textContent = '聞いています…（黙ると送ります。もう一度タップでも送れます）';
  curU = null;
}
let ending = false;
function pressEnd() {
  if (!talking || ending) return;
  $('ptt').classList.remove('on');
  if (isTap()) ptt.textContent = PTT_LABEL.tap;
  if (!activitySent) {
    talking = false;
    log('sys', `（声が届かなかったため送信しませんでした。最大の声の大きさ ${peakRms.toFixed(3)}）`);
    return;
  }
  // 末尾の言葉が切れないよう、0.3秒は音声を送り続けてから区切る
  ending = true;
  setTimeout(() => {
    talking = false; ending = false;
    if (!ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ realtimeInput: { activityEnd: {} } }));
    releasedAt = performance.now(); waitingFirstAudio = true;
    clearTimeout(noReplyTimer);
    noReplyTimer = setTimeout(() => { if (waitingFirstAudio) log('sys', '（10秒たっても応答がありません。本番では「お電話が遠いようです」と出す）'); }, 10000);
  }, 300);
  log('sys', `（最大の声の大きさ ${peakRms.toFixed(3)}）`);
}

async function onMessage(ev) {
  const raw = typeof ev.data === 'string' ? ev.data : await ev.data.text();
  const msg = JSON.parse(raw);
  if (msg.setupComplete) {
    status('つながりました');
    // 受話器を取らせるきっかけ。相手から第一声を言わせる
    ws.send(JSON.stringify({ clientContent: { turns: [{ role: 'user', parts: [{ text: '（電話が鳴っています。受話器を取って第一声だけを言ってください）' }] }], turnComplete: true } }));
    stopRing && stopRing();
    $('ptt').disabled = false; ready = true;
  }
  const sc = msg.serverContent;
  if (sc) {
    for (const p of sc.modelTurn?.parts || []) {
      if (p.inlineData?.data) {
        if (waitingFirstAudio) { log('sys', `応答までの時間: ${Math.round(performance.now() - releasedAt)} ms`); waitingFirstAudio = false; }
        playPcm24k(p.inlineData.data);
      }
    }
    if (sc.inputTranscription?.text) {
      curU ??= log('u', '参加者: '); curU.textContent += sc.inputTranscription.text;
      // 常時通話では話し終わりが分からないので、最後に聞き取れた時点から測る
      if (isAuto()) { releasedAt = performance.now(); waitingFirstAudio = true; }
    }
    if (sc.outputTranscription?.text) { curM ??= log('m', '相手: '); curM.textContent += sc.outputTranscription.text; }
    if (sc.interrupted) { stopPlayback(); log('sys', '（割り込み）'); }
    if (sc.turnComplete || (isAuto() && sc.inputTranscription?.text && curM)) { curM = null; }
    if (sc.turnComplete) curU = null;
  }
  if (msg.usageMetadata) {
    const u = msg.usageMetadata;
    $('usage').textContent = `累計トークン: ${u.totalTokenCount ?? '-'}（詳細: ${JSON.stringify(u)}）`;
  }
  if (msg.goAway) log('sys', `goAway: ${JSON.stringify(msg.goAway)}`);
}

let stopRing = null;
$('call').onclick = async () => {
  $('call').disabled = true; $('mode').disabled = true; $('voice').disabled = true; ready = false; $('log').textContent = ''; $('usage').textContent = '';
  try {
    status('呼び出し中…'); stopRing = ring();
    // iPadでは音声の再生・録音の準備をタップの直後（await の前）に作っておかないと止まったままになる
    ctxOut = new AudioContext();
    ctxIn = new AudioContext();
    await startMic();
    const k = new URLSearchParams(location.search).get('k') || '';
    const r = await fetch(`${GAS_URL}?k=${encodeURIComponent(k)}&voice=${$('voice').value}&vad=${isAuto() ? $('mode').value : 'off'}`).then(r => r.json());
    if (r.error) throw new Error(r.error);
    ws = new WebSocket(`${WS_BASE}?access_token=${encodeURIComponent(r.token)}`);
    ws.onopen = () => ws.send(JSON.stringify({ setup: r.setup }));
    ws.onmessage = onMessage;
    ws.onerror = () => log('sys', 'WebSocketエラー');
    ws.onclose = e => { log('sys', `切断（code ${e.code} ${e.reason}） 通話時間 ${Math.round((Date.now() - callStart) / 1000)} 秒`); cleanup(); };
    callStart = Date.now();
    $('hang').disabled = false;
    log('sys', `声: ${$('voice').value}／方式: ${$('mode').selectedOptions[0].text}`);
  } catch (e) {
    log('sys', 'エラー: ' + e.message); stopRing && stopRing(); cleanup();
  }
};
$('hang').onclick = () => ws && ws.close();

function cleanup() {
  talking = false; ending = false; stopPlayback();
  micStream?.getTracks().forEach(t => t.stop());
  ctxIn?.close(); ctxIn = null;
  ctxOut?.close(); ctxOut = null;
  $('ptt').disabled = true; $('hang').disabled = true; $('call').disabled = false; $('mode').disabled = false; $('voice').disabled = false; ready = false; $('level').textContent = '-'; status('待機中');
}

const ptt = $('ptt');
function isAuto() { return $('mode').value === 'low' || $('mode').value === 'high'; }
function isTap() { return $('mode').value === 'tap'; }
const PTT_LABEL = { hold: '押している間だけ話す（パソコンはスペースキーでも可）', tap: 'タップして話す（黙ると自動で送ります）' };
function applyMode() { ptt.hidden = isAuto(); $('auto').hidden = !isAuto(); if (!isAuto()) ptt.textContent = PTT_LABEL[$('mode').value]; }
$('mode').onchange = applyMode; applyMode();
ptt.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (isTap()) { talking ? pressEnd() : pressStart(); return; }
  ptt.setPointerCapture(e.pointerId); pressStart();
});
ptt.addEventListener('pointerup', () => { if (!isTap()) pressEnd(); });
ptt.addEventListener('pointercancel', () => { if (!isTap()) pressEnd(); });
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat || isAuto()) return;
  e.preventDefault();
  if (isTap()) { talking ? pressEnd() : pressStart(); } else pressStart();
});
document.addEventListener('keyup', e => { if (e.code === 'Space' && !isAuto() && !isTap()) { e.preventDefault(); pressEnd(); } });
</script>
</body>
</html>
